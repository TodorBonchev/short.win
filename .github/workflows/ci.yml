# CI for the on-chain workspace (ARCHITECTURE §1.1, §8.4, §9 M0, M0b).
# Actions are pinned to commit SHAs; the tag each SHA was resolved from is in the comment.
# The host Rust toolchain (1.98.1, rustfmt, clippy, wasm32) comes from rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AGAVE_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"
  PLATFORM_TOOLS: "v1.57"
  SBPF_ARCH: "v3"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  PYTHON_VERSION: "3.14"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - run: cargo fmt --all --check
      - name: T-CU-MATH bench workspace (standalone, tests/bench/cu_math)
        run: cargo fmt --all --check --manifest-path tests/bench/cu_math/Cargo.toml

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: shortwin-math keeps the ARCHITECTURE §2.2 deny lints
        run: |
          block=$(tr '\n' ' ' < crates/shortwin-math/src/lib.rs | grep -o '#!\[deny([^]]*\]' || true)
          for lint in arithmetic_side_effects cast_possible_truncation cast_sign_loss unwrap_used; do
            grep -q "clippy::$lint" <<< "$block" || { echo "::error::crates/shortwin-math/src/lib.rs must #![deny(clippy::$lint)]"; exit 1; }
          done
          grep -q '^#!\[no_std\]' crates/shortwin-math/src/lib.rs || { echo "::error::shortwin-math must be #![no_std]"; exit 1; }
      - name: shortwin-math has zero runtime dependencies
        run: |
          deps=$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); p=[p for p in m["packages"] if p["name"]=="shortwin-math"][0]; print(" ".join(d["name"] for d in p["dependencies"] if d["kind"] is None))')
          [ -z "$deps" ] || { echo "::error::shortwin-math must have no runtime dependencies, found: $deps"; exit 1; }
      - run: cargo clippy -p shortwin-math --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace build unifies features: tests/litesvm enables shortwin's TEST-ONLY
      # `test-venue` (A49), so lint the release feature set of the program on its own too.
      - name: shortwin without test-venue (the release feature set)
        run: cargo clippy -p shortwin --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: "2000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p shortwin-math -p shortwin-math-wasm --locked

  vectors:
    # Committed test vectors must be exactly what the normative sims generate today.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Regenerate every tests/vectors/<track>/gen_*.py
        run: |
          shopt -s nullglob
          for gen in crates/shortwin-math/tests/vectors/*/gen_*.py; do
            echo "::group::$gen"; python3 "$gen"; echo "::endgroup::"
          done
      - run: git diff --exit-code -- crates/shortwin-math/tests/vectors
      # T-CONFIG, host part (ARCH §8.1, A73): the default configuration passes
      # shortwin_sim.validate_params and the 1,655-run liveness battery of config_check.py
      # (the Rust side, params::validate = validate_params, is tests/params_vectors.rs).
      - name: T-CONFIG default configuration passes config_check.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          out=$(python3 docs/design/sim/config_check.py)
          echo "$out"
          [ "$out" = "OK" ] || { echo "::error::config_check.py did not print OK for the defaults"; exit 1; }
      # T-CONFIG, governance gate (A73): scripts/config-gate.sh rejects a proposal with a
      # liveness row or outside validate_params and asks for the owner's sign-off on
      # lender-income-only rows.
      - name: T-CONFIG config gate (scripts/config-gate.sh)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/test_config_gate.py -v

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      - run: cargo deny check
      # Same exceptions as deny.toml (unmaintained, not vulnerable): bincode 1.3.3 via
      # anchor-lang 1.2.0; ansi_term, derivative, paste, libsecp256k1 via the LiteSVM test harness.
      - name: cargo audit (workspace and the standalone bench lockfiles)
        run: |
          ignore="--ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2021-0139 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0161"
          for lock in Cargo.lock tests/bench/cu_math/Cargo.lock tests/bench/m1_cu/Cargo.lock tests/bench/m2_cu/Cargo.lock tests/bench/m3_cu/Cargo.lock; do
            echo "::group::$lock"; cargo audit -f "$lock" --deny warnings $ignore; echo "::endgroup::"
          done

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p shortwin-math -p shortwin-math-wasm --target wasm32-unknown-unknown --release --locked

  cu-math:
    # T-CU-MATH (ARCH §6.1, §8.1, §9 M0b): per-primitive CU budgets of shortwin-math on SBF v3,
    # measured with Mollusk (tests/bench/cu_math, a standalone workspace with its own lockfile).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cu-math-${{ env.PLATFORM_TOOLS }}
          workspaces: tests/bench/cu_math
      - name: Cache Agave and platform-tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - name: Build the bench program (platform-tools v1.57, SBPF v3)
        run: |
          cargo-build-sbf --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --manifest-path tests/bench/cu_math/program/Cargo.toml --sbf-out-dir tests/bench/cu_math/target/deploy
          flags=$(od -An -t x4 -j 48 -N 4 tests/bench/cu_math/target/deploy/cu_math_bench.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
      - run: cargo clippy --manifest-path tests/bench/cu_math/Cargo.toml --release --all-targets --locked -- -D warnings
      - name: Budgets (fails above the §6.1 value + 20 %)
        run: CU_MATH_WRITE=1 cargo test --manifest-path tests/bench/cu_math/Cargo.toml --release --locked -- --nocapture
      - name: results.md is current (informational)
        run: git diff --exit-code -- tests/bench/cu_math/results.md || echo "::warning::CU figures changed; commit tests/bench/cu_math/results.md"

  anchor-build:
    # Always `anchor build --tools-version v1.57 --arch v3`, never a bare `cargo build-sbf`
    # (Agave 4.1.2's cargo-build-sbf 4.1.0 defaults to platform-tools v1.54 / arch v0).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ env.PLATFORM_TOOLS }}
      - name: Cache Agave, platform-tools and the Anchor CLI
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
            ~/.cargo/bin/anchor
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/otter-sec/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked
      - name: Versions
        run: |
          solana --version
          anchor --version
          cargo-build-sbf --version
      # --ignore-keys: the program-id keypair is never committed, so a CI checkout gets a
      # throwaway one; the program id itself comes from declare_id! in the source.
      - run: anchor build --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" --ignore-keys
      - name: Artifact is SBPF v3
        run: |
          flags=$(od -An -t x4 -j 48 -N 4 target/deploy/shortwin.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
          sha256sum target/deploy/shortwin.so
      # A49: the release artifact knows nothing of the TEST-ONLY mock venue (tests/mock_cpamm,
      # built alongside for the LiteSVM tests and never deployed): its program id must not
      # occur in shortwin.so, neither as 32 bytes of data nor as the four 64-bit `lddw`
      # immediates the compiler turns a constant key into. `VenueKind::Mock` (feature
      # `test-venue`) would embed it. The search must find the id in mock_cpamm.so itself.
      - name: Release artifact has no mock venue (A49)
        run: |
          python3 - <<'PY'
          import re, sys
          src = open("tests/mock_cpamm/src/lib.rs").read()
          pid = re.search(r'declare_id!\("([1-9A-HJ-NP-Za-km-z]{32,44})"\)', src).group(1)
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          n = 0
          for c in pid:
              n = n * 58 + alphabet.index(c)
          key = n.to_bytes(32, "big")
          words = [key[i:i + 8] for i in range(0, 32, 8)]
          def embeds(path):
              elf = open(path, "rb").read()
              return (key in elf
                      or all(w in elf for w in words)
                      or all(w[:4] + bytes(4) + w[4:] in elf for w in words))
          if not embeds("target/deploy/mock_cpamm.so"):
              print("::error::the search does not find the mock id in mock_cpamm.so itself"); sys.exit(1)
          if embeds("target/deploy/shortwin.so"):
              print(f"::error::target/deploy/shortwin.so embeds the mock venue id {pid} (test-venue build?)"); sys.exit(1)
          print(f"ok: mock venue id {pid} absent from the release shortwin.so")
          PY
          flags=$(od -An -t x4 -j 48 -N 4 target/deploy/mock_cpamm.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::mock_cpamm.so e_flags=$flags, expected SBPF v3"; exit 1; }
      # A49, M2: the test-venue variant (`VenueKind::Mock`) is built by its own script into its
      # own target directory (target/test-venue), never into target/deploy. The release
      # artifact must carry neither the test-venue marker string (logged by the mock adapter)
      # nor the mock id (checked above); the test-venue build must carry both, which proves
      # the checks can see them.
      - name: Test-venue build (scripts/build-test-venue.sh)
        run: scripts/build-test-venue.sh
      - name: Release artifact has no test-venue code path (A49)
        run: |
          marker="shortwin:test-venue:mock-cpamm"
          if LC_ALL=C grep -aq "$marker" target/deploy/shortwin.so; then
            echo "::error::target/deploy/shortwin.so contains the test-venue marker: the release build enabled test-venue"; exit 1
          fi
          LC_ALL=C grep -aq "$marker" target/test-venue/deploy/shortwin.so || { echo "::error::the test-venue build lacks its marker"; exit 1; }
          if cmp -s target/deploy/shortwin.so target/test-venue/deploy/shortwin.so; then
            echo "::error::the release and test-venue builds are identical"; exit 1
          fi
          python3 - <<'PY'
          import re, sys
          src = open("tests/mock_cpamm/src/lib.rs").read()
          pid = re.search(r'declare_id!\("([1-9A-HJ-NP-Za-km-z]{32,44})"\)', src).group(1)
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          n = 0
          for c in pid:
              n = n * 58 + alphabet.index(c)
          key = n.to_bytes(32, "big")
          words = [key[i:i + 8] for i in range(0, 32, 8)]
          elf = open("target/test-venue/deploy/shortwin.so", "rb").read()
          if not (key in elf or all(w in elf for w in words) or all(w[:4] + bytes(4) + w[4:] in elf for w in words)):
              print("::error::the mock id search does not find the id in the test-venue shortwin.so"); sys.exit(1)
          print("ok: the test-venue build embeds the mock id; the release build does not")
          PY
          sha256sum target/deploy/shortwin.so target/test-venue/deploy/shortwin.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shortwin-program
          # mock_cpamm.so: the TEST-ONLY mock venue the M2 LiteSVM tests load (never deployed);
          # test-venue/deploy/shortwin.so: short.win's TEST-ONLY build with `VenueKind::Mock`
          # (the engine tests, `Env::test_venue`; never deployed).
          path: |
            target/deploy/shortwin.so
            target/deploy/mock_cpamm.so
            target/test-venue/deploy/shortwin.so
            target/idl/shortwin.json
            target/types/shortwin.ts
          if-no-files-found: error

  program-tests:
    # Program tests on LiteSVM 0.16 (ARCH §8.2, §8.3) against the anchor-build artifact, incl.
    # crank_sol_usd on the committed mainnet PriceUpdateV2 dump (tests/litesvm/tests/oracle_*.rs)
    # and, from M3, the Raydium mainnet fork (the dumped AMM v4 / CPMM programs and pools:
    # ray_math_it, ray_it, raydium_v4_e2e / raydium_v4_attacks, raydium_cpmm_e2e,
    # latch_raydium_it, trace_raydium_it, tx_size_raydium); the fixtures' checksums; the unit
    # tests of the program and the venue-state readers; and the T-LAYOUT wasm32 leg (the layout
    # asserts compiled for wasm32).
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: program-tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # SHA256SUMS covers every fixture file; scripts/dump-fixtures.py check (offline) also
      # checks the Raydium entries of manifest.json against their files and each other (the
      # ProgramData reconstructions, the cross-references of pools, vaults, mints and configs).
      - name: Mainnet fixtures match their recorded checksums (tests/fixtures/manifest.json)
        run: |
          (cd tests/fixtures && sha256sum -c --quiet SHA256SUMS)
          python3 scripts/dump-fixtures.py check
      - name: T-LAYOUT wasm32 leg
        run: cargo check -p shortwin --target wasm32-unknown-unknown --locked
      # Selected with the harness, shortwin's unit tests build with `test-venue` (feature
      # unification); run them once more on the release feature set.
      - name: shortwin unit tests without test-venue
        run: cargo test -p shortwin --locked
      - run: cargo test -p shortwin -p shortwin-venue-state -p shortwin-litesvm-tests --locked

  t-pot:
    # T-POT gate (ARCH §8.2, §9 M1 exit criteria; M1-FID-2): every `pool_model` v0.4.1 trace
    # replayed through the program in release — the reviewer's 40-seed stranding table (the
    # R3A-2 row asserted exactly: 40 seeds, 20,399 lamports, worst seed 596), the lock-heavy mix
    # with the untouched-state I-P4, the extended profiles and both ECON §9.6 fuzz runs (60,000
    # operations each) — with the invariant hooks after every instruction and the I-P6 liveness
    # cap at the model's own figure. The `program-tests` job replays only a quick subset. ~4 min.
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: t-pot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: T-POT, every trace (SHORTWIN_TRACES=full)
        env:
          SHORTWIN_TRACES: full
        run: "cargo test --release --locked -p shortwin-litesvm-tests --test lender_it traces:: -- --nocapture"

  codama:
    # Codama client (ARCH §1.1, §8.4 "IDL and Codama diff checks"): the committed IDL copy is
    # the anchor-build IDL, the committed client is what Codama generates from it, and it
    # typechecks and passes its tests (incl. the T-LAYOUT Codama leg). Node and pnpm come from
    # mise.toml.
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: IDL copy is current
        run: |
          diff -u clients/js/idl/shortwin.json target/idl/shortwin.json || {
            echo "::error::clients/js/idl/shortwin.json is stale: pnpm --filter @shortwin/client idl:sync && pnpm --filter @shortwin/client generate"
            exit 1
          }
      - name: Generated client is current
        run: |
          pnpm --filter @shortwin/client generate
          git diff --exit-code -- clients/js
          untracked=$(git status --porcelain --untracked-files=all -- clients/js)
          [ -z "$untracked" ] || { echo "$untracked"; echo "::error::regenerate and commit clients/js"; exit 1; }
      - run: pnpm --filter @shortwin/client typecheck
      - run: pnpm --filter @shortwin/client test

  m1-cu:
    # M1 CU baseline (ARCH §6.1, §9 M1): every M1 instruction on Mollusk 0.15.1 within its
    # budget, cross-checked on LiteSVM (tests/bench/m1_cu, a standalone workspace with its own
    # lockfile; README.md there).
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m1-cu
          workspaces: tests/bench/m1_cu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - run: cargo fmt --manifest-path tests/bench/m1_cu/Cargo.toml -p m1-cu-bench --check
      - run: cargo clippy --manifest-path tests/bench/m1_cu/Cargo.toml --all-targets --locked -- -D warnings
      - name: Budgets (fails above a budget or on a failed case)
        run: M1_CU_WRITE=1 cargo test --manifest-path tests/bench/m1_cu/Cargo.toml --locked -- --nocapture
      - name: results.md is current (informational)
        run: git diff --exit-code -- tests/bench/m1_cu/results.md || echo "::warning::M1 CU figures changed; commit tests/bench/m1_cu/results.md"

  m2-cu:
    # M2 CU bench and T-TRACE (ARCH §6.1, §6.2, §8.2 T-CU / T-TRACE, §9 M2): every M2
    # instruction on Mollusk 0.15.1 against the TEST-ONLY mock venue within its budget,
    # cross-checked on LiteSVM; the worst-case M2 transactions within 64 trace entries
    # (tests/bench/m2_cu, a standalone workspace with its own lockfile; README.md there). It
    # loads the test-venue shortwin.so and mock_cpamm.so from the anchor-build artifact.
    # Every M2 handler has landed: a case or transaction that does not execute fails the job.
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m2-cu
          workspaces: tests/bench/m2_cu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - run: cargo fmt --manifest-path tests/bench/m2_cu/Cargo.toml -p m2-cu-bench --check
      - run: cargo clippy --manifest-path tests/bench/m2_cu/Cargo.toml --all-targets --locked -- -D warnings
      - name: Budgets and T-TRACE (fails above a budget, above 64 trace entries, or on a failed case)
        run: M2_CU_WRITE=1 M2_TRACE_WRITE=1 cargo test --manifest-path tests/bench/m2_cu/Cargo.toml --locked -- --nocapture
      - name: results.md and trace.md are current (informational)
        run: git diff --exit-code -- tests/bench/m2_cu/results.md tests/bench/m2_cu/trace.md || echo "::warning::M2 CU or trace figures changed; commit tests/bench/m2_cu/results.md and trace.md"

  m3-cu:
    # M3 CU bench, T-TRACE and stack depth on Raydium (ARCH §6.1–§6.4, §8.2 T-RAY-CU / T-RAY-TRACE /
    # T-CU / T-TRACE, §9 M3; since M4 also `propose_pool` / `execute_pool_switch` within §6.1's
    # 100 k): every Raydium-path instruction of the release build on the dumped
    # AMM v4 / CPMM programs on Mollusk 0.15.1 within its budget, cross-checked on LiteSVM; the
    # worst-case Raydium transactions at their exact trace counts (≤ 64); every path through 0–3
    # levels of the TEST-ONLY CPI wrapper (tests/bench/m3_cu, a standalone workspace with its own
    # lockfile; README.md there). Loads the release shortwin.so from the anchor-build artifact.
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m3-cu-${{ env.PLATFORM_TOOLS }}
          workspaces: tests/bench/m3_cu
      - name: Cache Agave and platform-tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: Build the TEST-ONLY CPI wrapper (platform-tools v1.57, SBPF v3; never deployed)
        run: |
          cargo-build-sbf --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --manifest-path tests/bench/m3_cu/wrapper/Cargo.toml --sbf-out-dir tests/bench/m3_cu/target/deploy -- --locked
          flags=$(od -An -t x4 -j 48 -N 4 tests/bench/m3_cu/target/deploy/m3_cpi_wrapper.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
      - run: cargo fmt --manifest-path tests/bench/m3_cu/Cargo.toml --all --check
      - run: cargo clippy --manifest-path tests/bench/m3_cu/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Budgets, T-TRACE and depth (fails above a budget, off the expected trace or depth, above 64 entries, or on a failed case)
        run: M3_CU_WRITE=1 M3_TRACE_WRITE=1 M3_DEPTH_WRITE=1 cargo test --manifest-path tests/bench/m3_cu/Cargo.toml --locked -- --nocapture
      - name: results.md, trace.md and depth.md are current (informational)
        run: git diff --exit-code -- tests/bench/m3_cu/results.md tests/bench/m3_cu/trace.md tests/bench/m3_cu/depth.md || echo "::warning::M3 CU, trace or depth figures changed; commit tests/bench/m3_cu/{results,trace,depth}.md"

  services:
    # The off-chain services workspace (services/, its own Cargo.lock; ARCH §1.2, §7.1): fmt,
    # clippy (the workspace, and the keeper alone on its release feature set, without the
    # TEST-ONLY `test-venue`), cargo-deny and cargo-audit on its lockfile, the keeper's unit
    # tests and its LiteSVM scenarios (duties 1–4, batching, degraded mode, duty 10's venue
    # monitor, M4's duty 5 Raydium fast path and duty 12 pool monitor; every keeper transaction
    # under the invariant hooks) against the anchor-build artifacts, and the A49
    # check that the keeper binary carries no mock-venue code.
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: services
          workspaces: services
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - run: cargo fmt --manifest-path services/Cargo.toml -p shortwin-services-common -p shortwin-keeper -p shortwin-keeper-litesvm --check
      - run: cargo clippy --manifest-path services/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: The keeper on its release feature set (no test-venue)
        run: cargo clippy --manifest-path services/Cargo.toml -p shortwin-keeper --all-targets --locked -- -D warnings
      - name: cargo deny (services/deny.toml)
        run: cargo deny --manifest-path services/Cargo.toml check
      - name: cargo audit (services lockfile; the root deny.toml's exceptions)
        run: >-
          cargo audit -f services/Cargo.lock --deny warnings
          --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2021-0139 --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0161
      - name: Keeper unit tests and LiteSVM scenarios
        env:
          SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
          MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: cargo test --manifest-path services/Cargo.toml --workspace --locked -- --nocapture
      # A49 for the keeper: the release binary is built without `test-venue`, so it must not
      # embed the mock venue's program id; the scenario test binary (built with it) must.
      - name: The keeper binary has no mock venue (A49)
        run: |
          cargo build --manifest-path services/Cargo.toml -p shortwin-keeper --release --locked
          cargo test --manifest-path services/Cargo.toml -p shortwin-keeper-litesvm --test scenarios --no-run --locked
          python3 - <<'PY'
          import glob, os, re, sys
          src = open("tests/mock_cpamm/src/lib.rs").read()
          pid = re.search(r'declare_id!\("([1-9A-HJ-NP-Za-km-z]{32,44})"\)', src).group(1)
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          n = 0
          for c in pid:
              n = n * 58 + alphabet.index(c)
          key = n.to_bytes(32, "big")
          words = [key[i:i + 8] for i in range(0, 32, 8)]
          def embeds(path):
              elf = open(path, "rb").read()
              return key in elf or all(w in elf for w in words)
          tests = [p for p in glob.glob("services/target/debug/deps/scenarios-*")
                   if os.access(p, os.X_OK) and not p.endswith(".d")]
          if not tests or not embeds(max(tests, key=os.path.getmtime)):
              print("::error::the search does not find the mock id in the keeper's scenario binary"); sys.exit(1)
          if embeds("services/target/release/shortwin-keeper"):
              print(f"::error::the release keeper embeds the mock venue id {pid} (test-venue enabled?)"); sys.exit(1)
          print(f"ok: mock venue id {pid} absent from the release keeper")
          PY

  t-size:
    # T-SIZE on Raydium (ARCH §6.4, §8.2; §9 M3): every Raydium transaction — open_short,
    # close_short, liquidate, expire, sol_settle and crank batches — in its worst case (compute
    # budget, a separate fee payer, a first-time borrower, the largest extras set) fits 1,232 B and
    # 64 accounts as a v0 transaction through the protocol ALT (A28 as enumerated, and the table
    # scripts/build-alt.sh builds), and executes that way on the mainnet fork under the invariant
    # hooks (tests/litesvm/tests/tx_size_raydium.rs; the size table is printed). Also the protocol
    # ALT's static part as scripts/build-alt.sh builds it, uploaded for review with the live
    # recipients added at `create` time. (program-tests and services run the same tests; this job
    # keeps the size table and the address list in one log.)
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: t-size
          workspaces: |
            .
            services
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: T-SIZE, Raydium (v0 through the protocol ALT, executed on the fork)
        env:
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: cargo test --locked -p shortwin-litesvm-tests --test tx_size_raydium -- --nocapture
      - name: The protocol ALT's static part (scripts/build-alt.sh print)
        run: scripts/build-alt.sh print | tee protocol-alt-static.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-alt
          path: protocol-alt-static.txt
