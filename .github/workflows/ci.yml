# CI for the on-chain workspace (ARCHITECTURE §1.1, §8.4, §9 M0, M0b).
# Actions are pinned to commit SHAs; the tag each SHA was resolved from is in the comment.
# The host Rust toolchain (1.98.1, rustfmt, clippy, wasm32) comes from rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: "Run the fuzz-nightly job for this long per profile (e.g. 30m, 5h); empty: skip it"
        required: false
        default: ""
  # M7: the invariant fuzzer's nightly run (fuzz-nightly). GitHub runs `schedule` on the default
  # branch only. The nightly run builds the programs (anchor-build) and fuzzes; every other job
  # carries `if: github.event_name != 'schedule'` (it already ran on the push that made main).
  # Opt-in (owner decision 2026-10-02): the private repository's Actions minutes cannot carry
  # 6 × 5 h every night, so a scheduled run does nothing unless the repository variable
  # FUZZ_NIGHTLY is `true` (`gh variable set FUZZ_NIGHTLY --body true`); long fuzz runs are local
  # (tests/fuzz/README.md). workflow_dispatch with `fuzz_duration` still runs it on demand.
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a push to main never cancels the nightly fuzz run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AGAVE_VERSION: "4.1.2"
  # GitHub release assets for v4.1.2 (linux/x86_64), independently checked against the
  # release API. The archive pin is needed too: agave-install does not hash semver downloads.
  AGAVE_INSTALL_INIT_SHA256: "383470506dcd9035fb57f9a16a308ba80916a30755c6d3ceff6724cf35bbdc98"
  AGAVE_RELEASE_SHA256: "5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770"
  ANCHOR_VERSION: "1.2.0"
  # The verified, annotated v1.2.0 tag resolves to this commit.
  ANCHOR_REV: "84a63f9f7112b23581816436fbcf3f6c515779f9"
  PLATFORM_TOOLS: "v1.57"
  SBPF_ARCH: "v3"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  PYTHON_VERSION: "3.14"
  # M10 verifiable build (job verifiable-build, scripts/verifiable-build.sh): solana-verify and the
  # image its 0.5.2 IMAGE_MAP pins for (4,1,2), Docker Hub solanafoundation/solana-verifiable-build:4.1.2.
  SOLANA_VERIFY_VERSION: "0.5.2"
  SVB_IMAGE_DIGEST: "sha256:2e0b78f44ee76612e9260c7c988570c5e14de6fbd93e0ab07115ec7054473b4f"

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - run: cargo fmt --all --check
      - name: T-CU-MATH bench workspace (standalone, tests/bench/cu_math)
        run: cargo fmt --all --check --manifest-path tests/bench/cu_math/Cargo.toml

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: shortwin-math keeps the ARCHITECTURE §2.2 deny lints
        run: |
          block=$(tr '\n' ' ' < crates/shortwin-math/src/lib.rs | grep -o '#!\[deny([^]]*\]' || true)
          for lint in arithmetic_side_effects cast_possible_truncation cast_sign_loss unwrap_used; do
            grep -q "clippy::$lint" <<< "$block" || { echo "::error::crates/shortwin-math/src/lib.rs must #![deny(clippy::$lint)]"; exit 1; }
          done
          grep -q '^#!\[no_std\]' crates/shortwin-math/src/lib.rs || { echo "::error::shortwin-math must be #![no_std]"; exit 1; }
      - name: shortwin-math has zero runtime dependencies
        run: |
          deps=$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); p=[p for p in m["packages"] if p["name"]=="shortwin-math"][0]; print(" ".join(d["name"] for d in p["dependencies"] if d["kind"] is None))')
          [ -z "$deps" ] || { echo "::error::shortwin-math must have no runtime dependencies, found: $deps"; exit 1; }
      - run: cargo clippy -p shortwin-math --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace build unifies features: tests/litesvm enables shortwin's TEST-ONLY
      # `test-venue` (A49), so lint the release feature set of the program on its own too.
      - name: shortwin without test-venue (the release feature set)
        run: cargo clippy -p shortwin --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: "2000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p shortwin-math -p shortwin-math-wasm -p shortwin-price-report -p shortwin-jupiter-route -p squads-v4-ix --locked

  vectors:
    # Committed test vectors must be exactly what the normative sims generate today.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Regenerate every tests/vectors/<track>/gen_*.py
        run: |
          shopt -s nullglob
          for gen in crates/shortwin-math/tests/vectors/*/gen_*.py; do
            echo "::group::$gen"; python3 "$gen"; echo "::endgroup::"
          done
      - run: git diff --exit-code -- crates/shortwin-math/tests/vectors
      # T-CONFIG, host part (ARCH §8.1, A73): the default configuration passes
      # shortwin_sim.validate_params and the 1,655-run liveness battery of config_check.py
      # (the Rust side, params::validate = validate_params, is tests/params_vectors.rs).
      - name: T-CONFIG default configuration passes config_check.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          out=$(python3 docs/design/sim/config_check.py)
          echo "$out"
          [ "$out" = "OK" ] || { echo "::error::config_check.py did not print OK for the defaults"; exit 1; }
      # T-CONFIG, governance gate (A73): scripts/config-gate.sh rejects a proposal with a
      # liveness row or outside validate_params and asks for the owner's sign-off on
      # lender-income-only rows.
      - name: T-CONFIG config gate (scripts/config-gate.sh)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/test_config_gate.py -v

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      - name: Temporary advisory review remains current
        run: python3 scripts/check_advisory_review.py
      - name: cargo deny (workspace and standalone bench lockfiles)
        run: |
          cargo deny --locked check
          for manifest in tests/bench/{cu_math,m1_cu,m2_cu,m3_cu,m5_cu,m6_cu}/Cargo.toml; do
            echo "::group::$manifest"
            cargo deny --manifest-path "$manifest" --config deny.toml --locked check
            echo "::endgroup::"
          done
      # Same IDs as deny.toml: legacy unmaintained crates plus the dated public-operation
      # nonapplicability review in docs/audit/dependency-advisories-2026-10-27.md.
      - name: cargo audit (workspace and the standalone bench lockfiles)
        run: |
          ignore="--ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2021-0139 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0161 --ignore RUSTSEC-2026-0387"
          for lock in Cargo.lock tests/bench/cu_math/Cargo.lock tests/bench/m1_cu/Cargo.lock tests/bench/m2_cu/Cargo.lock tests/bench/m3_cu/Cargo.lock tests/bench/m5_cu/Cargo.lock tests/bench/m6_cu/Cargo.lock; do
            echo "::group::$lock"; cargo audit -f "$lock" --deny warnings $ignore; echo "::endgroup::"
          done

  wasm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p shortwin-math -p shortwin-math-wasm --target wasm32-unknown-unknown --release --locked

  cu-math:
    # T-CU-MATH (ARCH §6.1, §8.1, §9 M0b): per-primitive CU budgets of shortwin-math on SBF v3,
    # measured with Mollusk (tests/bench/cu_math, a standalone workspace with its own lockfile).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cu-math-${{ env.PLATFORM_TOOLS }}
          workspaces: tests/bench/cu_math
      - name: Cache Agave and platform-tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - name: Build the bench program (platform-tools v1.57, SBPF v3)
        run: |
          cargo-build-sbf --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --manifest-path tests/bench/cu_math/program/Cargo.toml \
            --sbf-out-dir tests/bench/cu_math/target/deploy -- --locked
          flags=$(od -An -t x4 -j 48 -N 4 tests/bench/cu_math/target/deploy/cu_math_bench.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
      - run: cargo clippy --manifest-path tests/bench/cu_math/Cargo.toml --release --all-targets --locked -- -D warnings
      - name: Budgets (fails above the §6.1 value + 20 %)
        run: CU_MATH_WRITE=1 cargo test --manifest-path tests/bench/cu_math/Cargo.toml --release --locked -- --nocapture
      - name: results.md is current (informational)
        run: git diff --exit-code -- tests/bench/cu_math/results.md || echo "::warning::CU figures changed; commit tests/bench/cu_math/results.md"

  anchor-build:
    # Always `anchor build --tools-version v1.57 --arch v3`, never a bare `cargo build-sbf`
    # (Agave 4.1.2's cargo-build-sbf 4.1.0 defaults to platform-tools v1.54 / arch v0).
    if: github.event_name != 'schedule' || vars.FUZZ_NIGHTLY == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ env.PLATFORM_TOOLS }}
      - name: Cache Agave, platform-tools and the Anchor CLI
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
            ~/.cargo/bin/anchor
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-anchor-${{ env.ANCHOR_REV }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        # rust-cache can restore a pre-existing anchor binary even when the tools cache misses.
        # Force this exact revision to replace it instead of failing with "binary already exists".
        run: cargo install --force --git https://github.com/otter-sec/anchor --rev "$ANCHOR_REV" anchor-cli --locked
      - name: Versions
        run: |
          solana --version
          anchor --version
          cargo-build-sbf --version
      # --ignore-keys: the program-id keypair is never committed, so a CI checkout gets a
      # throwaway one; the program id itself comes from declare_id! in the source. Anchor forwards
      # its trailing args directly to cargo-build-sbf, hence the second `--` before Cargo's flags.
      - name: Build release artifacts and IDL from the lockfile
        run: |
          set -o pipefail
          mkdir -p target
          python3 -m unittest discover -s scripts/tests -v
          anchor build --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --ignore-keys --no-idl -- -- --locked 2>&1 | tee target/sbf-release-build.log
          python3 scripts/check-sbf-stack.py target/sbf-release-build.log
          mkdir -p target/idl target/types
          anchor idl build -p shortwin -o target/idl/shortwin.json \
            -t target/types/shortwin.ts -- --locked
      # shortwin.so, the one deployed program (the straddle helper complete_curve of M5 was retired
      # with pump's v3 exits before it was ever deployed: design pump-final §11, owner decision D2).
      - name: Artifacts are SBPF v3
        run: |
          for so in target/deploy/shortwin.so; do
            flags=$(od -An -t x4 -j 48 -N 4 "$so" | tr -d ' ')
            [ "$flags" = "00000003" ] || { echo "::error::$so e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
          done
          sha256sum target/deploy/shortwin.so
      # A49: the release artifact knows nothing of the TEST-ONLY mock venue (tests/mock_cpamm,
      # built alongside for the LiteSVM tests and never deployed): its program id must not
      # occur in shortwin.so, neither as 32 bytes of data nor as the four 64-bit `lddw`
      # immediates the compiler turns a constant key into. `VenueKind::Mock` (feature
      # `test-venue`) would embed it. The search must find the id in mock_cpamm.so itself.
      - name: Release artifact has no mock venue (A49)
        run: |
          python3 scripts/check-a49.py --has-id target/deploy/mock_cpamm.so \
            --no-id target/deploy/shortwin.so
          flags=$(od -An -t x4 -j 48 -N 4 target/deploy/mock_cpamm.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::mock_cpamm.so e_flags=$flags, expected SBPF v3"; exit 1; }
      # A49, M2: the test-venue variant (`VenueKind::Mock`) is built by its own script into its
      # own target directory (target/test-venue), never into target/deploy. The release
      # artifact must carry neither the test-venue marker string (logged by the mock adapter)
      # nor the mock id (checked above); the test-venue build must carry both, which proves
      # the checks can see them.
      - name: Test-venue build (scripts/build-test-venue.sh)
        run: scripts/build-test-venue.sh
      - name: Release artifact has no test-venue code path (A49)
        run: |
          marker="shortwin:test-venue:mock-cpamm"
          if LC_ALL=C grep -aq "$marker" target/deploy/shortwin.so; then
            echo "::error::target/deploy/shortwin.so contains the test-venue marker: the release build enabled test-venue"; exit 1
          fi
          LC_ALL=C grep -aq "$marker" target/test-venue/deploy/shortwin.so || { echo "::error::the test-venue build lacks its marker"; exit 1; }
          if cmp -s target/deploy/shortwin.so target/test-venue/deploy/shortwin.so; then
            echo "::error::the release and test-venue builds are identical"; exit 1
          fi
          python3 scripts/check-a49.py --has-id target/test-venue/deploy/shortwin.so
          sha256sum target/deploy/shortwin.so target/test-venue/deploy/shortwin.so
      # SECTXT-1 (ARCH §8.5, M10): the deployed program embeds exactly one valid security.txt
      # (solana-security-txt =1.1.3, the `security_txt!` of its lib.rs) with the expected name,
      # the owner's values (Q3, 2026-10-02: no OWNER-FILL placeholder, the release gate) and
      # `source_release` = "v" + the program's Cargo.toml version; the TEST-ONLY test-venue build
      # compiles it out.
      - name: Release artifacts carry security.txt (SECTXT-1)
        run: |
          python3 scripts/test_check_security_txt.py
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' "programs/$1/Cargo.toml" | head -n 1; }
          python3 scripts/check-security-txt.py --forbid-placeholders --source-release "v$(version shortwin)" \
            target/deploy/shortwin.so "short.win"
          if LC_ALL=C grep -aq '=======BEGIN SECURITY.TXT V1=======' target/test-venue/deploy/shortwin.so; then
            echo "::error::target/test-venue/deploy/shortwin.so carries a security.txt (TEST-ONLY build)"; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shortwin-program
          # mock_cpamm.so: the TEST-ONLY mock venue the M2 LiteSVM tests load (never deployed);
          # test-venue/deploy/shortwin.so: short.win's TEST-ONLY build with `VenueKind::Mock`
          # (the engine tests, `Env::test_venue`; never deployed).
          path: |
            target/deploy/shortwin.so
            target/deploy/mock_cpamm.so
            target/test-venue/deploy/shortwin.so
            target/idl/shortwin.json
            target/sbf-release-build.log
            target/types/shortwin.ts
          if-no-files-found: error

  verifiable-build:
    # M10 verifiable build (ARCH §1.1 "Verifiable build", C1-5; §9 M10): shortwin (the one deployed
    # program since complete_curve's retirement, pump-final D2) built by solana-verify
    # $SOLANA_VERIFY_VERSION in its pinned Agave 4.1.2 image (picked through
    # [workspace.metadata.cli] solana = "4.1.2"; $SVB_IMAGE_DIGEST), `--arch v3
    # --cargo-build-sbf-args="--tools-version v1.57"`, by scripts/verifiable-build.sh. It must be
    # byte-identical to the anchor-build artifact the tests, CU benches and fuzzers ran against:
    # the binary we deploy and that verify.osec.io rebuilds is then the tested one. The A49 checks
    # run on these files too (the deploy artifact). The hashes (file sha256, and solana-verify's
    # trailing-zero-trimmed executable hash, which `solana-verify get-program-hash` and
    # verify.osec.io compare with the on-chain ProgramData) go to the job summary and the
    # `verifiable-build` artifact. Hosts without Docker: `scripts/verifiable-build.sh --local`.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml (to install solana-verify)
        run: rustup toolchain install || rustup show
      - name: Cache solana-verify ${{ env.SOLANA_VERIFY_VERSION }}
        id: sv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}
      - name: Install solana-verify ${{ env.SOLANA_VERIFY_VERSION }}
        if: steps.sv.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version "=${SOLANA_VERIFY_VERSION}" --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: anchor-build
      - name: Verifiable build of shortwin; byte-equal to the anchor-build artifact
        env:
          # On pull_request the checkout is the merge commit; the hashes file names the PR head too.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/verifiable-build.sh --out verifiable --compare anchor-build/deploy
      - name: Only the pinned image was used
        run: |
          imgs=$(docker images --digests --format '{{.Repository}}@{{.Digest}}' | grep solana-verifiable-build | sort -u)
          [ "$imgs" = "solanafoundation/solana-verifiable-build@${SVB_IMAGE_DIGEST}" ] || { echo "::error::images: $imgs"; exit 1; }
      - name: Verifiable artifacts have no mock venue and no test-venue code path (A49)
        run: |
          python3 scripts/check-a49.py \
            --has-id anchor-build/deploy/mock_cpamm.so --has-marker anchor-build/test-venue/deploy/shortwin.so \
            --no-id verifiable/shortwin.so \
            --no-marker verifiable/shortwin.so
      - name: Job summary
        if: always()
        run: |
          [ -f verifiable/verifiable-hashes.txt ] || exit 0
          { echo '### Verifiable build'; echo '```'; cat verifiable/verifiable-hashes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verifiable-build
          path: |
            verifiable/verifiable-hashes.txt
            verifiable/shortwin.so
            verifiable/*.build.log
          if-no-files-found: error

  program-tests:
    # Program tests on LiteSVM 0.16 (ARCH §8.2, §8.3) against the anchor-build artifact, incl.
    # crank_sol_usd on the committed mainnet PriceUpdateV2 dump (tests/litesvm/tests/oracle_*.rs)
    # and, from M3, the Raydium mainnet fork (the dumped AMM v4 / CPMM programs and pools:
    # ray_math_it, ray_it, raydium_v4_e2e / raydium_v4_attacks, raydium_cpmm_e2e,
    # latch_raydium_it, trace_raydium_it, tx_size_raydium) and, from M5, the pump fork (the dumped
    # pump / pump-fees / PumpSwap programs and coins: pump_math_it, pump_it, synthetic_exit_it
    # (pump-final's exits past rT; M5's straddle_it left with the complete_curve helper, D2),
    # pump_curve_scenarios / pump_curve_attacks / pump_curve_e2e,
    # trace_pump_it, tx_size_pump_it, latch_pump_it) and, from M6, the PumpSwap fork and the
    # graduation (the dumped canonical pools of the pamm_state / pamm_synthetic groups: pamm_it,
    # graduation_e2e / graduation_scenarios, pumpswap_negvqr_e2e, trace_pumpswap_it,
    # tx_size_pumpswap_it, latch_pumpswap_it, replay_0428_it on the test-venue build; the Surfpool
    # E2E graduation_surfpool is #[ignore]d: it needs a live Surfpool, scripts/surfpool-e2e.sh)
    # and, from M7, T-COVERAGE's set_coverage_pause part, T-TIER, T-CAP and the launch guard
    # (coverage_pause_it, tier_transition_it, caps_boundary_it, launch_guard_it; I4's coverage
    # clause in the hooks); the fixtures' checksums; the unit tests of the program and the
    # venue-state readers; and the T-LAYOUT wasm32 leg (the layout asserts compiled for wasm32).
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: program-tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # SHA256SUMS covers every fixture file; scripts/dump-fixtures.py check (offline) also
      # checks the Raydium entries of manifest.json against their files and each other (the
      # ProgramData reconstructions, the cross-references of pools, vaults, mints and configs).
      - name: Mainnet fixtures match their recorded checksums (tests/fixtures/manifest.json)
        run: |
          (cd tests/fixtures && sha256sum -c --quiet SHA256SUMS)
          python3 scripts/dump-fixtures.py check
      - name: T-LAYOUT wasm32 leg
        run: cargo check -p shortwin --target wasm32-unknown-unknown --locked
      # Selected with the harness, shortwin's unit tests build with `test-venue` (feature
      # unification); run them once more on the release feature set.
      - name: shortwin unit tests without test-venue
        run: cargo test -p shortwin --locked
      - run: cargo test -p shortwin -p shortwin-venue-state -p shortwin-litesvm-tests --locked
        env:
          # The defaults resolve to the same files (the artifact is downloaded to target/); named
          # for the reader.
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
          SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
          MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so

  t-pot:
    # T-POT gate (ARCH §8.2, §9 M1 exit criteria; M1-FID-2): every `pool_model` v0.4.1 trace
    # replayed through the program in release — the reviewer's 40-seed stranding table (the
    # current R3A-2 row asserted exactly: 40 seeds, 15,273 lamports, worst seed 444), the lock-heavy mix
    # with the untouched-state I-P4, the extended profiles and both ECON §9.6 fuzz runs (60,000
    # operations each) — with the invariant hooks after every instruction and the I-P6 liveness
    # cap at the model's own figure. The `program-tests` job replays only a quick subset. ~4 min.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: t-pot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: T-POT, every trace (SHORTWIN_TRACES=full)
        env:
          SHORTWIN_TRACES: full
        run: "cargo test --release --locked -p shortwin-litesvm-tests --test lender_it traces:: -- --nocapture"

  codama:
    # Codama client (ARCH §1.1, §8.4 "IDL and Codama diff checks"): the committed IDL copy is
    # the anchor-build IDL, the committed client is what Codama generates from it, and it
    # typechecks and passes its tests (incl. the T-LAYOUT Codama leg). Node and pnpm come from
    # mise.toml.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: IDL copy is current
        run: |
          diff -u clients/js/idl/shortwin.json target/idl/shortwin.json || {
            echo "::error::clients/js/idl/shortwin.json is stale: pnpm --filter @shortwin/client idl:sync && pnpm --filter @shortwin/client generate"
            exit 1
          }
      - name: Generated client is current
        run: |
          pnpm --filter @shortwin/client generate
          git diff --exit-code -- clients/js
          untracked=$(git status --porcelain --untracked-files=all -- clients/js)
          [ -z "$untracked" ] || { echo "$untracked"; echo "::error::regenerate and commit clients/js"; exit 1; }
      - run: pnpm --filter @shortwin/client typecheck
      - run: pnpm --filter @shortwin/client test

  web:
    # M9 web frontend (docs/design/FRONTEND.md §10.4): the WASM math package built from
    # crates/shortwin-math-wasm (wasm-bindgen =0.2.129, the crate's pin) and the facade's JS
    # interface checked from Node (js/smoke.cjs on a --target nodejs build: BigInt arguments,
    # undefined results, thrown errors, the worked examples), then Biome, the type check, Vitest
    # and the production build of apps/web (`web-e2e` runs the Playwright suite).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: wasm-bindgen CLI (the crate's exact pin)
        run: cargo install wasm-bindgen-cli --version =0.2.129 --locked
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shortwin/math-wasm build
      - name: The WASM facade from Node (crates/shortwin-math-wasm/js/smoke.cjs)
        run: |
          cargo build -p shortwin-math-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target nodejs --out-dir target/wasm-pkg \
            target/wasm32-unknown-unknown/release/shortwin_math_wasm.wasm
          node crates/shortwin-math-wasm/js/smoke.cjs target/wasm-pkg
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  web-e2e:
    # M9 web E2E (docs/design/FRONTEND.md §10.2–§10.4; apps/web/e2e), profile `chain`: Playwright
    # 1.63 on a local solana-test-validator (Agave 4.1.2) loading the anchor-build artifact's
    # test-venue shortwin.so and mock_cpamm.so (no complete_curve.so since pump's v3 exits,
    # pump-final D2) plus the dumped venue fixtures of
    # tests/fixtures, seeded by e2e/validator/seed.ts (Kit + @shortwin/client); the production build
    # of apps/web served by vite preview; the injected "ShortWin E2E" Wallet Standard wallet (and, in
    # the Android project, the protocol-level fake Mobile Wallet Adapter wallet, O-6, then again
    # with the adapter built off); the
    # indexer as a Playwright-routed mock built from the chain. Playwright's own Chromium, installed
    # into the runner user's cache (`SHORTWIN_CHROMIUM=playwright`; the hosted image carries its
    # system libraries). Every spec runs (the M9 exit, FRONTEND.md §12.3: incl. lend-cpi-guard and
    # lend-withdraw-memo of §10.3, axe on every page and the `screens` pass, whose PNGs are kept as
    # an artifact for review).
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORTWIN_CHROMIUM: playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: wasm-bindgen CLI (the crate's exact pin)
        run: cargo install wasm-bindgen-cli --version =0.2.129 --locked
      - name: Cache Agave
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/solana/install
          key: agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
          "$HOME/.local/share/solana/install/active_release/bin/solana-test-validator" --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: The test-venue build (A49) and the mock venue are present
        run: |
          LC_ALL=C grep -aq "shortwin:test-venue:mock-cpamm" target/test-venue/deploy/shortwin.so
          ls -l target/deploy/mock_cpamm.so
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shortwin/math-wasm build
      - name: Playwright's Chromium (user cache, no --with-deps)
        run: pnpm --filter web exec playwright install chromium
      - name: E2E (profile chain)
        run: pnpm --filter web e2e
      # Its mobile-shell PNGs go to .e2e/screenshots/android-mwa-off/: the artifact below keeps the
      # default build's android/ set.
      - name: E2E, the Mobile Wallet Adapter built off (O-6; the Android project, a rebuilt app)
        env:
          SHORTWIN_E2E_MWA: '0'
        run: pnpm --filter web e2e --project chain-android
      - name: Screenshots of every page (e2e/specs/screens.spec.ts)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-screenshots
          path: apps/web/.e2e/screenshots
          if-no-files-found: ignore
      - name: Report, traces and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e
          path: |
            apps/web/.e2e/report
            apps/web/.e2e/test-results
            apps/web/.e2e/logs
            apps/web/.e2e/state.json
          if-no-files-found: ignore

  m1-cu:
    # M1 CU baseline (ARCH §6.1, §9 M1): every M1 instruction on Mollusk 0.15.1 within its
    # budget, cross-checked on LiteSVM (tests/bench/m1_cu, a standalone workspace with its own
    # lockfile; README.md there).
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m1-cu
          workspaces: tests/bench/m1_cu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
