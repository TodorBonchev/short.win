      - run: cargo clippy --manifest-path tests/bench/m5_cu/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Budgets, T-TRACE, sizes and depth (fails above a budget or CU limit, off the expected trace, peak or depth, above 64 entries or 1,232 B v0, or on a failed case)
        run: M5_CU_WRITE=1 M5_TRACE_WRITE=1 M5_DEPTH_WRITE=1 cargo test --manifest-path tests/bench/m5_cu/Cargo.toml --locked -- --nocapture
      - name: results.md, trace.md and depth.md are current (informational)
        run: git diff --exit-code -- tests/bench/m5_cu/results.md tests/bench/m5_cu/trace.md tests/bench/m5_cu/depth.md || echo "::warning::M5 CU, trace or depth figures changed; commit tests/bench/m5_cu/{results,trace,depth}.md"

  m6-cu:
    # M6 CU bench, T-TRACE, T-SIZE, T-DEPTH and the graduation transition on the PumpSwap venue
    # (ARCH §5.4, §6.1–§6.4, §8.2, §9 M6): every PumpSwap-path instruction and the → PumpSwap
    # transition of the release build on the dumped PumpSwap / pump / pump-fees programs on Mollusk
    # 0.15.1 within its budget, cross-checked on LiteSVM; the worst-case PumpSwap transactions at
    # their exact trace counts (≤ 64) and v0 + ALT sizes; every path through 0–3 levels of the
    # TEST-ONLY CPI wrapper (tests/bench/m6_cu, a standalone workspace with its own lockfile;
    # README.md there). Loads the release shortwin.so from the anchor-build artifact.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m6-cu-${{ env.PLATFORM_TOOLS }}
          workspaces: tests/bench/m6_cu
      - name: Cache Agave and platform-tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: Build the TEST-ONLY CPI wrapper (platform-tools v1.57, SBPF v3; never deployed)
        run: |
          cargo-build-sbf --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --manifest-path tests/bench/m6_cu/wrapper/Cargo.toml --sbf-out-dir tests/bench/m6_cu/target/deploy -- --locked
          flags=$(od -An -t x4 -j 48 -N 4 tests/bench/m6_cu/target/deploy/m6_cpi_wrapper.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
      - run: cargo fmt --manifest-path tests/bench/m6_cu/Cargo.toml --all --check
      - run: cargo clippy --manifest-path tests/bench/m6_cu/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Budgets, T-TRACE, sizes and depth (fails above a budget or CU limit, off the expected trace, peak or depth, above 64 entries or 1,232 B v0, or on a failed case)
        run: M6_CU_WRITE=1 M6_TRACE_WRITE=1 M6_DEPTH_WRITE=1 cargo test --manifest-path tests/bench/m6_cu/Cargo.toml --locked -- --nocapture
      - name: results.md, trace.md and depth.md are current (informational)
        run: git diff --exit-code -- tests/bench/m6_cu/results.md tests/bench/m6_cu/trace.md tests/bench/m6_cu/depth.md || echo "::warning::M6 CU, trace or depth figures changed; commit tests/bench/m6_cu/{results,trace,depth}.md"

  services:
    # The off-chain services workspace (services/, its own Cargo.lock; ARCH §1.2, §7.1, §7.2): fmt,
    # clippy (the workspace — the M8 indexer crates included —, and the keeper alone on its
    # release feature set, without the TEST-ONLY `test-venue`), cargo-deny and cargo-audit on its
    # lockfile, the keeper's unit tests and its LiteSVM scenarios (duties 1–4, batching, degraded mode, duty 10's venue
    # monitor, M4's duty 5 Raydium fast path and duty 12 pool monitor, M5's duty 6 on the pump
    # curve — migrate_v2, and since pump v3 the synthetic exits past rT with the same-tick
    # graduation (graduation) and the two TradeExtras lists across short.win 1.0.0's upgrade
    # (upgrade_window) — and M6's move onto PumpSwap, PumpSwap exits, the post-wipe claims and
    # duty 13's sweep_trader; M7's degraded mode with the on-chain coverage pause — the drill,
    # the budget, a restart, the role unset or rotated, two instances (coverage_pause) —, duty
    # 11's crank_sol_usd (oracle) and the PumpSwap 4-extras T-SIZE through the keeper's tables
    # (pamm_alt); every keeper transaction under the invariant hooks) against the anchor-build
    # artifacts, and the A49 check that the keeper binary carries no mock-venue code. The M7
    # benches (m7_cost, cascade) are #[ignore]d here and run in release in m7-keeper-bench; the
    # indexer's tests (M8) run in `indexer`. M10 (WP-7): the governance tool `shortwin-gov`
    # (services/ops) — its unit tests and T-OPS, the whole governance sequence through its command
    # line on the mainnet Squads ELF.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: services
          workspaces: services
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - run: cargo fmt --manifest-path services/Cargo.toml -p shortwin-services-common -p shortwin-keeper -p shortwin-keeper-litesvm -p shortwin-indexer -p shortwin-indexer-litesvm -p shortwin-ops --check
      - run: cargo clippy --manifest-path services/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: The keeper on its release feature set (no test-venue)
        run: cargo clippy --manifest-path services/Cargo.toml -p shortwin-keeper --all-targets --locked -- -D warnings
      - name: Temporary advisory review remains current
        run: python3 scripts/check_advisory_review.py
      - name: cargo deny (services/deny.toml)
        run: cargo deny --manifest-path services/Cargo.toml --config services/deny.toml --locked check
      - name: cargo audit (services lockfile; dated usage-scoped exceptions)
        run: >-
          cargo audit -f services/Cargo.lock --deny warnings
          --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2021-0139 --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0161
          --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0391 --ignore RUSTSEC-2026-0398
          --ignore RUSTSEC-2026-0403 --ignore RUSTSEC-2026-0410
          --ignore RUSTSEC-2026-0395 --ignore RUSTSEC-2026-0396 --ignore RUSTSEC-2026-0397
          --ignore RUSTSEC-2026-0399 --ignore RUSTSEC-2026-0400 --ignore RUSTSEC-2026-0401
          --ignore RUSTSEC-2026-0402 --ignore RUSTSEC-2026-0404 --ignore RUSTSEC-2026-0405
          --ignore RUSTSEC-2026-0406
      - name: Keeper and shortwin-gov unit tests, LiteSVM scenarios and T-OPS (the indexer crates run in `indexer`)
        env:
          SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
          MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: >-
          cargo test --manifest-path services/Cargo.toml --workspace --locked
          --exclude shortwin-indexer --exclude shortwin-indexer-litesvm -- --nocapture
      # A49 for the keeper: the release binary is built without `test-venue`, so it must not
      # embed the mock venue's program id; the scenario test binary (built with it) must.
      - name: The keeper binary has no mock venue (A49)
        run: |
          cargo build --manifest-path services/Cargo.toml -p shortwin-keeper --release --locked
          cargo test --manifest-path services/Cargo.toml -p shortwin-keeper-litesvm --test scenarios --no-run --locked
          scenarios=$(find services/target/debug/deps -maxdepth 1 -name 'scenarios-*' ! -name '*.d' -perm -u+x \
            -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          [ -n "$scenarios" ] || { echo "::error::no keeper scenario test binary"; exit 1; }
          python3 scripts/check-a49.py --has-id "$scenarios" --no-id services/target/release/shortwin-keeper

  indexer:
    # M8, the indexer and API (services/indexer, services/indexer-litesvm; ARCH §7.2, §9 M8;
    # docs/design/INDEXER.md §11). PostgreSQL 17.11 runs embedded as the runner's user (the
    # zonky binaries, ~15 MB from Maven Central, cached; no service container, no root): the
    # fixture gate, the unit and decoder tests, ingest on INGEST's recorded sessions (ordering,
    # rebuild, rollback, the single writer), the analytics views and rollups, the API contract
    # tests (every operation and documented status against openapi.yaml on the API seed, the
    # rate and abuse limits, the WebSocket) and on replayed sessions with the chain's end state
    # served through the API; the M8 exit — the replay harness: LiteSVM sessions recorded from
    # the anchor-build artifacts (mock, Raydium and pump forks, keeper scenarios) replayed through
    # the real ingest pipeline into an embedded database and checked against the chain at every
    # checkpoint (§11.4: projections, ledgers, analytics, idempotence, rebuild, out-of-order
    # delivery, the finality tracker's rollback with the rollups, catalog coverage). Then the RPC
    # backfill, the logsSubscribe live source and finality promotion against a local
    # solana-test-validator, the production dependency set (no embedded Postgres), and the
    # reference docker-compose file (validated, not run).
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
      SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
      MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The 30-day load test's bulk load sorts through PostgreSQL's pgsql_tmp, beside the
      # services target/ and the replay sessions; on 2026-10-03 (run 37130341616) that filled the
      # runner's root disk ("No space left on device"). Drop the preinstalled SDKs this job never
      # uses (about 20 GB).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: indexer
          workspaces: services
      - name: Cache the embedded PostgreSQL binaries (INDEXER.md §11.1)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/shortwin/postgresql-zonky
          key: postgresql-zonky-17.11.0-${{ runner.os }}
      - name: Cache Agave (solana-test-validator)
        id: agave
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/solana/install
          key: agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.agave.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: The embedded-Postgres fixture (downloads the binaries on a cold cache)
        run: cargo test --manifest-path services/Cargo.toml --locked -p shortwin-indexer --test pg_fixture -- --nocapture
      - name: Indexer — unit and decoder tests, ingest, analytics, the API contract (seed and replayed sessions), the security review's regressions and its 30-day load test
        run: cargo test --manifest-path services/Cargo.toml --locked -p shortwin-indexer -- --nocapture
      - name: The replay harness — LiteSVM sessions through the real ingest into the chain state (M8 exit)
        run: cargo test --manifest-path services/Cargo.toml --locked -p shortwin-indexer-litesvm -- --nocapture
      - name: RPC backfill, logsSubscribe live source and finality against solana-test-validator (history past the status cache, a rolled-back cursor)
        run: >-
          cargo test --manifest-path services/Cargo.toml --locked -p shortwin-indexer
          --test ingest_rpc_validator -- --ignored --nocapture
      - name: The production indexer links no embedded Postgres (TEST-ONLY `embedded-pg`)
        run: |
          if cargo tree --manifest-path services/Cargo.toml --locked -p shortwin-indexer -e normal,build --prefix none | grep -q '^postgresql_embedded '; then
            echo "::error::shortwin-indexer's normal dependencies include postgresql_embedded"; exit 1
          fi
      - name: The reference deployment parses (services/indexer/deploy; not run)
        working-directory: services/indexer/deploy
        env:
          SHORTWIN_RPC_URL: http://127.0.0.1:8899
          SHORTWIN_WS_URL: ws://127.0.0.1:8900
        run: |
          docker compose config --quiet
          sh -n initdb/01-roles.sh

  t-size:
    # T-SIZE on Raydium (ARCH §6.4, §8.2; §9 M3): every Raydium transaction — open_short,
    # close_short, liquidate, expire, sol_settle and crank batches — in its worst case (compute
    # budget, a separate fee payer, a first-time borrower, the largest extras set) fits 1,232 B and
    # 64 accounts as a v0 transaction through the protocol ALT (A28 as enumerated, and the table
    # scripts/build-alt.sh builds), and executes that way on the mainnet fork under the invariant
    # hooks (tests/litesvm/tests/tx_size_raydium.rs; the size table is printed); from M5 the same
    # for every pump-curve transaction on the dumped pump programs and coins
    # (tests/litesvm/tests/tx_size_pump_it.rs: the largest extras set, the keeper's composite, crank
    # batches of 5; a tipped liquidation with the largest extras set is measured as not fitting v0,
    # ARCH §6.4) and from M6 for every PumpSwap transaction on the dumped canonical pools
    # (tests/litesvm/tests/tx_size_pumpswap_it.rs: the largest extras set, a first-time borrower, a
    # separate fee payer, the keeper's composite, crank batches of 3 — since M6R-1's LP mint the
    # open with the largest extras set and the keeper's composite with it are pinned 6–24 B over
    # 1,232 B through A28 and fitting through the build-alt table, the owner's T-SIZE trade-off,
    # ARCH §6.4). Also the protocol
    # ALT's static part as scripts/build-alt.sh builds it, uploaded for review with the live
    # recipients added at `create` time. (program-tests and services run the same tests; this job
    # keeps the size table and the address list in one log.)
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: t-size
          workspaces: |
            .
            services
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: T-SIZE, Raydium (v0 through the protocol ALT, executed on the fork)
        env:
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: cargo test --locked -p shortwin-litesvm-tests --test tx_size_raydium -- --nocapture
      - name: T-SIZE, the pump curve (v0 through the protocol ALT, executed on the fork)
        env:
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: cargo test --locked -p shortwin-litesvm-tests --test tx_size_pump_it -- --nocapture
      - name: T-SIZE, PumpSwap (v0 through the protocol ALT, executed on the fork)
        env:
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
        run: cargo test --locked -p shortwin-litesvm-tests --test tx_size_pumpswap_it -- --nocapture
      - name: The protocol ALT's static part (scripts/build-alt.sh print)
        run: scripts/build-alt.sh print | tee protocol-alt-static.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-alt
          path: protocol-alt-static.txt

  fuzz-smoke:
    # M7, the invariant fuzzer's per-push smoke (tests/fuzz, package shortwin-fuzz; ARCH §8.4):
    # fixed seeds on every profile (mock, mixed, curve, PumpSwap, AMM v4, CPMM) through
    # `Env::send`'s I1–I13, I15–I18 and A26 hooks plus the fuzzer's own oracles, the corpus replays
    # (a reproducer marked fixed must pass: FUZZ-M7-1) and the harness's self-tests (replay
    # determinism, tmin on an injected failure). Release without fat LTO, as fuzz-nightly.
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
      SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
      MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: Fuzz smoke, corpus replays, harness self-tests
        run: cargo test --release --locked -p shortwin-fuzz -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-smoke-crashes
          path: target/tmp/fuzz-smoke
          if-no-files-found: ignore
      # Freeze the standalone native runner and its exact inputs for an independently supervised
      # >=24-hour run. Smoke success is not long-run qualification; do not rebuild on the host.
      - name: Build and retain source-pinned fuzz runtime
        run: |
          cargo build --release --locked -p shortwin-fuzz --bin shortwin-fuzz
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import tarfile

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          root = Path.cwd()
          if command("git", "status", "--porcelain", "--untracked-files=no"):
              raise SystemExit("Tracked source changed during smoke; refusing a mismatched source archive")
          bundle = root / f"target/fuzz-runtime-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          bundle.mkdir(parents=True, exist_ok=False)
          (bundle / "bin").mkdir()
          (bundle / "inputs").mkdir(exist_ok=True)
          inputs = {
              "shortwin-fuzz": root / "target/release/shortwin-fuzz",
              "shortwin-release.so": Path(os.environ["SHORTWIN_SO"]),
              "shortwin-test-venue.so": Path(os.environ["SHORTWIN_TEST_VENUE_SO"]),
              "mock-cpamm.so": Path(os.environ["MOCK_CPAMM_SO"]),
          }
          artifacts = {}
          for name, source in inputs.items():
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"Missing or symlinked fuzz runtime input: {source}")
              destination = bundle / "bin" / name
              shutil.copy2(source, destination)
              artifacts[name] = {"file": f"bin/{name}", "bytes": destination.stat().st_size,
                                 "sha256": sha256(destination)}
          for name in ("Cargo.lock", "rust-toolchain.toml"):
              shutil.copy2(root / name, bundle / "inputs" / name)
          fixture_paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "tests/fixtures"]
          ).decode().split("\0")
          fixtures = []
          for name in sorted(filter(None, fixture_paths)):
              path = root / name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Missing or symlinked fixture: {name}")
              fixtures.append({"file": name, "bytes": path.stat().st_size,
                               "sha256": sha256(path)})
          if not fixtures:
              raise SystemExit("No tracked fixtures found")
          (bundle / "inputs/fixture-sha256.json").write_text(json.dumps(fixtures, indent=2) + "\n")
          subprocess.run(["git", "archive", "--format=tar.gz",
                          f"--output={bundle / 'source.tar.gz'}", "HEAD"], check=True)
          with tarfile.open(bundle / "source.tar.gz", "r:gz") as archive:
              for fixture in fixtures:
                  try:
                      member = archive.getmember(fixture["file"])
                  except KeyError:
                      raise SystemExit(f"Fixture missing from committed source archive: {fixture['file']}")
                  if not member.isfile() or member.size != fixture["bytes"]:
                      raise SystemExit(f"Fixture type/length mismatch in source archive: {fixture['file']}")
                  with archive.extractfile(member) as stream:
                      if hashlib.file_digest(stream, "sha256").hexdigest() != fixture["sha256"]:
                          raise SystemExit(f"Fixture bytes differ from committed source archive: {fixture['file']}")
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = json.loads(Path(event_path).read_text()) if event_path else {}
          provenance = {
              "schema_version": 1,
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "qualification": "smoke passed; no >=24-hour qualification claimed",
              "source": {"commit": command("git", "rev-parse", "HEAD"),
                         "tree": command("git", "rev-parse", "HEAD^{tree}"),
                         "pull_request_head": event.get("pull_request", {}).get("head", {}).get("sha"),
                         "archive": "source.tar.gz", "archive_sha256": sha256(bundle / "source.tar.gz")},
              "github": {key: os.environ.get(key) for key in (
                  "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA", "GITHUB_EVENT_NAME",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_WORKFLOW_REF")},
              "toolchain": {"rustc_verbose": command("rustc", "-Vv"),
                            "cargo": command("cargo", "--version"),
                            "active": command("rustup", "show", "active-toolchain"),
                            "platform": platform.platform(), "machine": platform.machine()},
              "build_command": ["cargo", "build", "--release", "--locked", "-p", "shortwin-fuzz",
                                "--bin", "shortwin-fuzz"],
              "smoke_command": ["cargo", "test", "--release", "--locked", "-p", "shortwin-fuzz",
                                "--", "--nocapture"],
              "release_profile": {key: os.environ[key] for key in (
                  "CARGO_PROFILE_RELEASE_LTO", "CARGO_PROFILE_RELEASE_CODEGEN_UNITS")},
              "artifacts": artifacts, "fixture_count": len(fixtures),
              "fixture_manifest": "inputs/fixture-sha256.json",
              "fixtures_match_committed_source_archive": True,
              "root_lock_sha256": sha256(root / "Cargo.lock"),
          }
          (bundle / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          (bundle / "README.txt").write_text(
              "CI smoke evidence and frozen inputs, not a completed 24-hour run.\n"
              "Verify SHA256SUMS before use; extract source.tar.gz for the source/fixture tree.\n"
              "Artifact download may strip executable mode: chmod +x bin/shortwin-fuzz.\n"
              "Only shortwin-release.so is deployable; other binaries are test-only evidence.\n"
              "Use an independently supervised all-profile run and retain its actual command,\n"
              "completion, summary, log bytes/hashes and immutable fixture/artifact identities.\n"
          )
          files = sorted(path for path in bundle.rglob("*") if path.is_file()
                         and path.name != "SHA256SUMS")
          (bundle / "SHA256SUMS").write_text("".join(
              f"{sha256(path)}  {path.relative_to(bundle)}\n" for path in files))
          print(json.dumps({"commit": provenance["source"]["commit"],
                            "fuzzer_sha256": artifacts["shortwin-fuzz"]["sha256"],
                            "fixture_count": len(fixtures)}, indent=2))
          PY
      - name: Source-pinned standalone fuzz runtime for qualification host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shortwin-fuzz-runtime
          path: target/fuzz-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90

  m7-keeper-bench:
    # M7 keeper economics (ARCH §6.6, §7.1, §8.2 T-CASCADE / T-SIZE; ECON §5.8): the real keeper
    # on the mock venue and the Raydium, pump-curve and PumpSwap forks (services/keeper-litesvm, in
    # release): the cost-model inputs (CU per instruction and venue, crank batches, cadence, cost
    # per market-day, load at 50 / 200 markets; tests/bench/m7_keeper), the PumpSwap 4-extras
    # T-SIZE through the keeper's tables (OWNER-M7-1) and T-CASCADE under the keeper's CU-per-slot
    # policy (tests/bench/m7_cascade). The gates are the tests' own asserts; the regenerated
    # figures are compared with the committed ones as a warning only (the load section's wall
    # times and RPC capacity vary run to run).
    if: github.event_name != 'schedule'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m7-keeper-bench
          workspaces: services
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: Keeper cost inputs, PumpSwap 4-extras T-SIZE, T-CASCADE (release)
        env:
          SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
          MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
          SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
          M7_COST_WRITE: "1"
          M7_CASCADE_WRITE: "1"
        run: >-
          cargo test --manifest-path services/Cargo.toml --release --locked
          -p shortwin-keeper-litesvm --test scenarios -- --include-ignored --nocapture
          m7_cost:: pamm_alt:: cascade::
      - name: The committed figures are current (informational)
        run: git diff --exit-code -- tests/bench/m7_keeper tests/bench/m7_cascade || echo "::warning::M7 keeper figures changed; commit tests/bench/m7_keeper and tests/bench/m7_cascade"

  fuzz-nightly:
    # M7 exit criterion "fuzz clean ≥ 24 h" (ARCH §8.4, §9): the invariant fuzzer (tests/fuzz,
    # package shortwin-fuzz: seeded action sequences on LiteSVM 0.16 through `Env::send`, so the
    # I1–I13, I15–I19 and A26 hooks run after every instruction, plus the fuzzer's own oracles).
    # Every night, one shard per profile, each `shortwin-fuzz run` for 5 h on every core of its
    # runner (6 shards ≈ 30 h of fuzzing, inside the 6 h hosted-job cap), failures minimised by
    # `tmin` and uploaded as crash files (replay: `shortwin-fuzz replay FILE`); the job fails on
    # any crash. Also on demand: workflow_dispatch with `fuzz_duration`. Release without fat LTO
    # (the fuzzer needs speed, not the deploy profile's link time).
    if: (github.event_name == 'schedule' && vars.FUZZ_NIGHTLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.fuzz_duration != '')
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: [mock, mixed, curve, pumpswap, amm-v4, cpmm]
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
      SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
      MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
      FUZZ_DURATION: ${{ inputs.fuzz_duration || '5h' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - run: cargo build --release --locked -p shortwin-fuzz
      # Once per night: the fixed-seed smoke of every profile, the corpus replays (each known
      # finding still fails with its signature, or passes once fixed) and the harness's self-tests.
      - name: Fuzz smoke, corpus replays, harness self-tests
        if: matrix.profile == 'mock'
        run: cargo test --release --locked -p shortwin-fuzz -- --nocapture
      - name: Fuzz ${{ matrix.profile }} for ${{ env.FUZZ_DURATION }}
        run: >-
          target/release/shortwin-fuzz run --profile ${{ matrix.profile }}
          --duration "$FUZZ_DURATION" --jobs "$(nproc)" --actions 400
          --seed ${{ github.run_id }} --out fuzz-out --minimize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-${{ matrix.profile }}
          path: fuzz-out
          if-no-files-found: ignore

  mutants:
    # M7-SEC-6: mutation testing of the open and coverage paths. scripts/mutants.sh builds this
    # checkout's LiteSVM tests and fuzzer once (the oracle: the I1–I19 hooks recompute from
    # shortwin-math and the harness's own venue views), then each of the M7 security review's seven
    # one-line program mutants (D4 without its EMA leg, the fee-scaled size cap doubled, the wallet
    # cap removed, Tier C as B, the coverage clear immediate, the curve caps on the live reserves,
    # the pump caps at the live fee), and requires the mutant's named tests and a 3-minute fuzz of
    # its profile to fail against it: a surviving mutant is a missing oracle and fails the job.
    # M10 KI-65 adds two mutants checked by `ki65_it` alone (no fuzz: their oracles need a share
    # rebase): claim_sol without `store_records`, and sync_lender without the owner check.
    # Nightly with fuzz-nightly (the schedule trigger, main; opt-in, FUZZ_NIGHTLY) and on demand
    # (workflow_dispatch).
    if: (github.event_name == 'schedule' && vars.FUZZ_NIGHTLY == 'true') || github.event_name == 'workflow_dispatch'
    needs: anchor-build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SHORTWIN_SO: ${{ github.workspace }}/target/deploy/shortwin.so
      SHORTWIN_TEST_VENUE_SO: ${{ github.workspace }}/target/test-venue/deploy/shortwin.so
      MOCK_CPAMM_SO: ${{ github.workspace }}/target/deploy/mock_cpamm.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
      - name: Cache Agave, platform-tools and the Anchor CLI
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
            ~/.cargo/bin/anchor
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-anchor-${{ env.ANCHOR_REV }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/otter-sec/anchor --rev "$ANCHOR_REV" anchor-cli --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: The review's mutants must be killed
        run: MUTANTS_JOBS="$(nproc)" scripts/mutants.sh --fuzz 3m --work "$RUNNER_TEMP/mutants"
