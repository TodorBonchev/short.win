        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: m3-cu-${{ env.PLATFORM_TOOLS }}
          workspaces: tests/bench/m3_cu
      - name: Cache Agave and platform-tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana/${{ env.PLATFORM_TOOLS }}
          key: sbf-tools-agave-${{ env.AGAVE_VERSION }}-${{ env.AGAVE_RELEASE_SHA256 }}-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/install-agave.sh
      - name: Select Agave ${{ env.AGAVE_VERSION }}
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/agave-install" init "$AGAVE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortwin-program
          path: target
      - name: Build the TEST-ONLY CPI wrapper (platform-tools v1.57, SBPF v3; never deployed)
        run: |
          cargo-build-sbf --tools-version "$PLATFORM_TOOLS" --arch "$SBPF_ARCH" \
            --manifest-path tests/bench/m3_cu/wrapper/Cargo.toml --sbf-out-dir tests/bench/m3_cu/target/deploy -- --locked
          flags=$(od -An -t x4 -j 48 -N 4 tests/bench/m3_cu/target/deploy/m3_cpi_wrapper.so | tr -d ' ')
          [ "$flags" = "00000003" ] || { echo "::error::e_flags=$flags, expected SBPF v3 (00000003)"; exit 1; }
      - run: cargo fmt --manifest-path tests/bench/m3_cu/Cargo.toml --all --check
      - run: cargo clippy --manifest-path tests/bench/m3_cu/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Budgets, T-TRACE and depth (fails above a budget, off the expected trace or depth, above 64 entries, or on a failed case)
        run: M3_CU_WRITE=1 M3_TRACE_WRITE=1 M3_DEPTH_WRITE=1 cargo test --manifest-path tests/bench/m3_cu/Cargo.toml --locked -- --nocapture
      - name: results.md, trace.md and depth.md are current (informational)
        run: git diff --exit-code -- tests/bench/m3_cu/results.md tests/bench/m3_cu/trace.md tests/bench/m3_cu/depth.md || echo "::warning::M3 CU, trace or depth figures changed; commit tests/bench/m3_cu/{results,trace,depth}.md"

