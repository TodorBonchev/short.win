# Keep this filename: GitHub already registers it on the default branch.
# Manual dispatch intentionally publishes the selected ref to the existing Pages production site.
name: deploy-web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: devnet-web
    env:
      SHORTWIN_VIDEO_OUTPUT: ${{ runner.temp }}/shortwin-videos
      VITE_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check client and web
        run: pnpm check
      - name: Install video dependencies
        working-directory: tools/social-video
        run: npm ci
      - name: Install missing media utilities
        shell: bash
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            packages+=(ffmpeg)
          fi
          for utility in zip unzip; do
            if ! command -v "$utility" >/dev/null; then
              packages+=("$utility")
            fi
          done
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${packages[@]}"
          fi
      - name: Check video source
        working-directory: tools/social-video
        run: npm run lint
      # Remotion installs its pinned headless browser automatically on the first render.
      - name: Render branded workflow videos
        working-directory: tools/social-video
        run: npm run export
      - name: Verify complete video and audio files
        working-directory: tools/social-video
        run: npm run verify
      - name: Build and validate the public showcase
        run: node scripts/build-public-web.mjs
      - name: Preserve the validated deployment and media report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-web-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            web/dist
            ${{ env.SHORTWIN_VIDEO_OUTPUT }}/verification.json
      - name: Deploy the public showcase to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          packageManager: npm
          command: pages deploy web/dist --project-name=shortwin-devnet --branch=main --commit-hash=${{ github.sha }}
