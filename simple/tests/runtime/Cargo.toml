[package]
name = "shortwin-simple-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../LICENSE"

[dependencies]
shortwin-simple = { path = "../../programs/shortwin-simple", features = ["no-entrypoint"] }
shortwin-pooled-core = { path = "../../crates/pooled-core" }
anchor-lang = "=1.2.0"
litesvm = "=0.16.0"
solana-account = "4.3"
solana-instruction = "~3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
solana-message = "=4.2.4"
solana-transaction-error = "~3.3.1"
litesvm-token = { version = "=0.16.0", features = ["token-2022"] }
solana-system-interface = { version = "3.0", features = ["bincode"] }
serde_json = "=1.0.151"
sha2 = "0.10"

# Keep the known LiteSVM/Agave4.2 runtime line.
agave-feature-set = "~4.2.2"
agave-reserved-account-keys = "~4.2.2"
solana-bpf-loader-program = "~4.2.2"
solana-builtins = "~4.2.2"
solana-compute-budget = "~4.2.2"
solana-compute-budget-instruction = "~4.2.2"
solana-fee = "~4.2.2"
solana-program-runtime = "~4.2.2"
solana-runtime-transaction = "~4.2.2"
solana-svm-callback = "~4.2.2"
solana-svm-feature-set = "~4.2.2"
solana-svm-log-collector = "~4.2.2"
solana-svm-timings = "~4.2.2"
solana-syscalls = "~4.2.2"
solana-system-program = "~4.2.2"
solana-transaction-context = "~4.2.2"
