# Always build with `anchor build --tools-version v1.57 --arch v3` (docs/DEVELOPMENT.md).
# Program tests run in-process (LiteSVM, from M1), so `anchor test` starts no validator.
skip_local_validator = true

[toolchain]
anchor_version = "1.2.0"
solana_version = "4.1.2"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[workspace]
# tests/mock_cpamm: the TEST-ONLY mock venue of M2 (ARCH §9, A49). It is built next to the
# program so the LiteSVM tests can load target/deploy/mock_cpamm.so; it is never deployed.
# programs/complete_curve: the stateless straddle helper `complete_curve` (ARCH §5.4, A66), deployed
# next to short.win (deploy by name: `anchor deploy -p shortwin`, `-p complete_curve`).
members = ["programs/shortwin", "programs/complete_curve", "tests/mock_cpamm"]

[programs.localnet]
shortwin = "5yvyAddWb8RRGh3pPiFS5eV33eZYeHVmAAfwAFmqVpKK"
mock_cpamm = "BPAZFPkmVtYEWEZHCzFUns7oybh1VWfAvmu3ofM2mQi7"
complete_curve = "4B5mGykX9EWwaYdbTvsp8qXCUTbc7caQourz16Gat6LJ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
