# cargo-deny 0.20 policy for the services workspace (services/, its own Cargo.lock;
# ARCHITECTURE §1.2, §8.4 "Static"). The root deny.toml's policy, plus what the JSON-RPC client
# stack brings (rustls, ring, webpki-roots).
# Run: cargo deny --manifest-path services/Cargo.toml check --config services/deny.toml

[graph]
all-features = false
no-default-features = false

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # Temporary native-Linux/current-caller nonapplicability; packages remain vulnerable.
    # Independently checked 2026-10-27; expires 2026-11-27 (CI checks the date).
    # No services ctutils exception: its potentially keyed paths use patched 0.4.4.
    # Additional explicit unsound-API dispositions exposed by the next cargo-audit run.
    { id = "RUSTSEC-2026-0395", reason = "StableInBuffer requires experimental and explicit enabling; current zstd graph does neither; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0396", reason = "Seekable APIs require seekable feature, absent from the complete current graph; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0397", reason = "current zstd wrappers never call OutBuffer::around_pos; private buffers use around at position zero; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0399", reason = "deprecated init_using_cdict/ddict requires experimental, absent from current graph; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0400", reason = "fresh Solana streaming contexts never mix unfinished streams with one-shot APIs; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0401", reason = "dictionary training is compiled but never called by the sole Solana consumers; no sample sizes admitted; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0402", reason = "CCtx try_clone requires experimental; current graph also never requests multithreaded workers; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0404", reason = "DCtx try_clone requires experimental and has no current caller; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0405", reason = "affected seekable compress_stream is not compiled; ordinary wrappers start InBuffer at zero; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0406", reason = "current contexts are single-threaded and configured before the first frame; no unfinished worker jobs; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint only through test-only public secp256k1 recovery; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0391", reason = "Solana decoder creates fresh zstd contexts, never reuses with_context; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0398", reason = "sole zstd-safe caller does not enable seekable, no Seekable API; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0403", reason = "Solana uses stream::read::Decoder, explicitly unaffected by this advisory; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    { id = "RUSTSEC-2026-0410", reason = "services run as native Linux binaries, outside affected wasm32 architecture; dependency-advisories-2026-10-27.md; expires 2026-11-27" },
    # The root deny.toml's exceptions (unmaintained, not vulnerable), which reach this workspace
    # through the same crates: anchor-lang 1.2.0 (bincode) and the LiteSVM 0.16 harness the
    # scenario tests link (tests/litesvm).
    { id = "RUSTSEC-2025-0141", reason = "bincode via anchor-lang 1.2.0; unmaintained, no advisory against 1.3.3's code" },
    { id = "RUSTSEC-2021-0139", reason = "ansi_term via litesvm 0.16 (keeper scenario tests only)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative via ark-* via solana-syscalls 4.2 (keeper scenario tests only)" },
    { id = "RUSTSEC-2024-0436", reason = "paste via ark-ff via solana-syscalls 4.2 (keeper scenario tests only)" },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 via solana-syscalls 4.2 (keeper scenario tests only)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # rustls-webpki, untrusted and ring (the RPC client's TLS stack).
    "ISC",
    # webpki-roots (the RPC client's TLS root store).
    "CDLA-Permissive-2.0",
    # postgresql_embedded / _archive / _commands ("(Apache-2.0 OR MIT) AND PostgreSQL"; OSI
    # approved, permissive): the indexer's TEST-ONLY embedded-Postgres fixture (INDEXER.md §11.1).
    "PostgreSQL",
]

# solana-config-interface declares its licence only as a file (the Apache-2.0 text, which
# cargo-deny recognises; `no-license-field` stays a warning).

[licenses.private]
ignore = true


# The three crates published to crates.io (shortwin, shortwin-math, shortwin-venue-state) declare
# `license-file = "../../LICENSE"`, the BUSL-1.1 with the short.win parameters, which the licence
# scanner reads with low confidence; it is BUSL-1.1 (REUSE.toml).
[[licenses.clarify]]
crate = "shortwin"
expression = "BUSL-1.1"
license-files = [{ path = "../../LICENSE", hash = 0xf2c05bd3 }]

[[licenses.clarify]]
crate = "shortwin-math"
expression = "BUSL-1.1"
license-files = [{ path = "../../LICENSE", hash = 0xf2c05bd3 }]

[[licenses.clarify]]
crate = "shortwin-venue-state"
expression = "BUSL-1.1"
license-files = [{ path = "../../LICENSE", hash = 0xf2c05bd3 }]


# ... and that licence is allowed for those three crates only.
[[licenses.exceptions]]
crate = "shortwin"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "shortwin-math"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "shortwin-venue-state"
allow = ["BUSL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { name = "solana-sdk" },
    { name = "solana-program", reason = "use the solana-* component crates" },
    { name = "pump-rust-client", reason = "ARCHITECTURE §2.1: never used; own readers in shortwin-venue-state" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
