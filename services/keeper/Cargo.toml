[package]
name = "shortwin-keeper"
version = "0.1.0"
description = "short.win keeper v0 (ARCHITECTURE §7.1 duties 1–4): observation coverage, deviation bursts, liquidate / expire at the first executable second, sol_settle re-checks, batched cranks, degraded mode"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# TEST-ONLY (A49): the mock venue's account lists (`VenueKind::Mock`), for the LiteSVM
# scenario tests (keeper-litesvm). The keeper binary never enables it.
test-venue = ["shortwin/test-venue"]

[dependencies]
shortwin.workspace = true
shortwin-math.workspace = true
shortwin-services-common.workspace = true
anchor-lang.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
solana-hash.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-pubkey.workspace = true
solana-signer.workspace = true

[[bin]]
name = "shortwin-keeper"
path = "src/main.rs"
