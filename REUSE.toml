# File licensing for the Jupiter pooled implementation.
version = 1
SPDX-PackageName = "short.win"
SPDX-PackageSupplier = "Todor Bonchev"

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Todor Bonchev"
SPDX-License-Identifier = "BUSL-1.1"

[[annotations]]
path = ["*.md", "**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Todor Bonchev"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

# Raw public-chain account state and captured HTTP/RPC evidence.
[[annotations]]
path = ["tests/fixtures/accounts/**", "tests/fixtures/current-routes/**", "tests/fixtures/jupiter-2026-10-27/*.json", "tests/fixtures/jupiter-2026-10-27/*.gz", "tests/fixtures/reference-rent/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "Public Solana mainnet data; any rights belong to its respective owners"
SPDX-License-Identifier = "LicenseRef-Public-Chain-Data"

[[annotations]]
path = "tests/fixtures/programs/raydium_cpmm_2026_10.so"
precedence = "override"
SPDX-FileCopyrightText = "Raydium"
SPDX-License-Identifier = "Apache-2.0"
