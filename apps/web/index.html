<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <!-- viewport-fit=cover: the safe-area insets (notch, home indicator) reach the CSS (--safe-*).
             Never maximum-scale / user-scalable=no: pinch-zoom stays (WCAG 1.4.4). -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark" />
        <!-- --bg-1 (styles/tokens.css), hard-coded: a meta cannot read a CSS variable. -->
        <meta name="theme-color" content="#12161b" />
        <meta name="referrer" content="no-referrer" />
        <meta name="description" content="ShortWin devnet preview for Solana token lending and shorting." />
        <!-- The brand mark on its tile (src/shell/Logo.tsx): the SVG favicon, PNG fallbacks for Safari and
             legacy browsers (plus /favicon.ico), the iOS home-screen icon and the web app manifest's
             "any" / "maskable" icons (public/manifest.webmanifest). -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <title>ShortWin — Devnet preview</title>
    </head>
    <body>
        <noscript>ShortWin needs JavaScript.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
