[package]
name = "complete-curve"
version = "1.0.0"
description = "short.win's stateless complete-curve helper (ARCHITECTURE §5.4, A66): completes a pump.fun bonding curve for the straddle bundle, reading real_token_reserves at execution"
edition = "2021"
# Built by the platform-tools rustc (v1.57 = 1.95) through `anchor build` (ARCHITECTURE §1.1).
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "complete_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# No-op here. `anchor build ... -- --features test-venue` passes the flag to every program of
# the Anchor workspace, and cargo refuses a feature the package does not declare. The feature
# gates `VenueKind::Mock` in short.win only (A49).
test-venue = []

[dependencies]
anchor-lang = "=1.2.0"
# The security.txt of the release ELF (M10 SECTXT-1; `src/lib.rs`): one macro, no dependencies
# without its `parser` feature. Exact pin: the blob layout is what Explorer parses.
solana-security-txt = "=1.1.3"
# The length-tolerant pump `BondingCurve` reader the core program and the keeper use (zero
# runtime dependencies, `no_std`): the helper reads `real_token_reserves` and `complete` with the
# same bytes-in, values-out function.
shortwin-venue-state = { path = "../../crates/shortwin-venue-state" }

# The discriminator check of the unit tests (the version the core program uses).
[dev-dependencies]
solana-sha256-hasher = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
