[package]
name = "shortwin-jupiter-oracle-compat"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

# Independent resolution. This probe must never join the production workspace.
[workspace]
resolver = "3"

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["event-cpi", "init-if-needed"] }
switchboard-on-demand = { version = "=0.13.0", default-features = false, features = ["no-entrypoint", "solana-v3"] }
solana-account-info = "=3.1.1"
solana-clock = "=3.1.1"
solana-instruction = "=3.4.1"
solana-pubkey = "=4.2.1"
# Switchboard calls its >=3 bridge feature "solana-v3". Pin the actual monolithic
# package whose component ranges match short.win's current ABI; do not take 5.x.
solana-program = "=4.0.0"
